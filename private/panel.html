<div id="admin-overlay" class="fixed inset-0 z-[60] hidden items-start justify-center overflow-y-auto bg-black/70 p-4 pt-24 backdrop-blur-sm" role="dialog" aria-modal="true" aria-label="Admin panel">
  <div class="w-full max-w-3xl rounded-3xl border border-white/10 bg-[#080808] shadow-2xl">
    <div class="flex items-center justify-between border-b border-white/10 px-6 py-4">
      <h2 class="text-lg font-semibold text-white">Admin panel</h2>
      <button id="admin-close" class="rounded-full border border-white/10 px-3 py-1 text-sm text-white/70 hover:bg-white/10 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-white">Close</button>
    </div>
    <div id="admin-tabs" class="flex gap-1 overflow-x-auto px-4 pt-3" role="tablist"></div>
    <div class="grid gap-6 p-6 md:grid-cols-2">
      <form id="admin-form" class="flex flex-col gap-3" autocomplete="off"></form>
      <ul id="admin-list" class="flex max-h-[26rem] flex-col gap-2 overflow-y-auto"></ul>
    </div>
    <p id="admin-msg" class="min-h-6 px-6 pb-4 text-sm text-white/60" role="status"></p>
  </div>
</div>
