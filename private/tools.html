<div id="tools-root" class="font-compact">
  <ul id="tools-grid" class="grid gap-4 pb-6 sm:grid-cols-2 lg:grid-cols-3"></ul>

  <div id="tool-overlay" class="fixed inset-0 z-[70] hidden bg-black/80 p-3 backdrop-blur-md sm:p-6" role="dialog" aria-modal="true" aria-labelledby="tool-title">
    <div class="mx-auto flex h-full max-w-6xl flex-col overflow-hidden rounded-2xl border border-white/[0.08] bg-[#09090b] shadow-2xl">
      <div class="flex items-center justify-between gap-4 border-b border-white/10 px-5 py-4 sm:px-6">
        <div class="min-w-0">
          <h3 id="tool-title" class="truncate text-lg font-semibold text-white"></h3>
          <p id="tool-desc" class="truncate text-sm text-white/50"></p>
        </div>
        <button id="tool-close" type="button" class="shrink-0 rounded-full border border-white/15 px-4 py-1.5 text-sm font-semibold text-white/80 hover:bg-white/10 hover:text-white">Close</button>
      </div>
      <div id="tool-body" class="min-h-0 flex-1 overflow-y-auto p-5 sm:p-6"></div>
      <p id="tool-status" class="min-h-9 border-t border-white/10 px-5 py-2 text-sm text-white/55 sm:px-6" role="status"></p>
    </div>
  </div>
</div>
